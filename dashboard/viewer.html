<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Source page</title>
  <style>
    :root { --navy: #1f3a5f; --ink: #1c2430; --ink-3: #74839a; --line: #d8dee8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 Inter, system-ui, sans-serif; color: var(--ink); }
    header {
      position: sticky; top: 0; z-index: 2;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line);
    }
    button, a.btn {
      font: inherit; font-weight: 600; border: 1px solid var(--line);
      background: #fff; color: var(--navy); padding: 6px 10px; cursor: pointer;
      text-decoration: none;
    }
    #status { color: var(--ink-3); margin-left: auto; }
    #status.err { color: #b42318; }
    #body { overflow: auto; background: #eef1f6; height: calc(100% - 52px);
            display: flex; justify-content: center; padding: 16px; position: relative; }
    canvas { background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.08); }
    #loading {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: #eef1f6; color: #1f3a5f; font-weight: 600;
    }
    #loading[hidden] { display: none; }
    #loading p { margin: 0; }
    #loadingPct { font-size: 12px; font-weight: 500; color: #74839a; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #d8dee8; border-top-color: #1f3a5f;
      animation: spin 0.7s linear infinite;
    }
    .bar { width: min(240px, 70%); height: 4px; background: #d8dee8; border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 40%; background: #1f3a5f; animation: bar 1.1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bar { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <header>
    <button type="button" id="prev">← Prev</button>
    <span id="pageLabel">—</span>
    <button type="button" id="next">Next →</button>
    <button type="button" id="hl">Hide highlight</button>
    <a id="raw" class="btn" href="#" target="_blank" rel="noopener">Download PDF</a>
    <span id="status">Loading…</span>
  </header>
  <div id="body">
    <div id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Opening the source book…</p>
      <div class="bar"><i id="loadingBar"></i></div>
      <p id="loadingPct">Fetching the page…</p>
    </div>
    <canvas id="cv"></canvas>
  </div>
  <script type="module">
    const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build";
    const STORE_KEY = "sutterEvidenceViewer";
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isErr) {
      const el = $("status");
      el.textContent = msg || "";
      el.classList.toggle("err", !!isErr);
    }

    function readStore() {
      try {
        const o = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!o || !o.t || Date.now() - o.t > 30 * 60 * 1000) return {};
        return o;
      } catch (_) {
        return {};
      }
    }

    function readParams() {
      const search = new URLSearchParams(location.search);
      const hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      const store = readStore();
      const get = (k) => search.get(k) || hash.get(k) || store[k] || "";
      return {
        book: get("book"),
        pdf: get("pdf") || get("file"),
        page: get("page"),
        q: get("q"),
        hl: get("hl"),
      };
    }

    const params = readParams();
    const startPage = Math.max(1, parseInt(params.page || "1", 10) || 1);
    const query = params.q || "";
    let highlightOn = params.hl !== "0";
    let pdf, pageNum = startPage, token = 0, pdfjsLib = null;

    function originUrl(rel) {
      // Resolve from this page's folder so project-site hosts
      // (user.github.io/repo/…) find data/ and pdfs/.
      const base = new URL(".", location.href);
      return new URL(String(rel || "").replace(/^\//, ""), base).href;
    }

    function multiplyTransform(m1, m2) {
      return [
        m1[0] * m2[0] + m1[2] * m2[1],
        m1[1] * m2[0] + m1[3] * m2[1],
        m1[0] * m2[2] + m1[2] * m2[3],
        m1[1] * m2[2] + m1[3] * m2[3],
        m1[0] * m2[4] + m1[2] * m2[5] + m1[4],
        m1[1] * m2[4] + m1[3] * m2[5] + m1[5],
      ];
    }

    function transformItem(viewport, it) {
      if (pdfjsLib && pdfjsLib.Util && pdfjsLib.Util.transform) {
        return pdfjsLib.Util.transform(viewport.transform, it.transform);
      }
      return multiplyTransform(viewport.transform, it.transform);
    }

    async function resolvePdfUrl() {
      const book = params.book;
      let path = params.pdf;
      if (book) {
        try {
          const books = await fetch(originUrl("data/books.json")).then((r) => {
            if (!r.ok) throw new Error("books.json " + r.status);
            return r.json();
          });
          const rec = books[book];
          if (rec && rec.file) return originUrl("pdfs/" + rec.file);
        } catch (e) {
          console.warn(e);
        }
      }
      if (!path) return null;
      if (/^https?:/i.test(path)) return path;
      return originUrl(path.replace(/^\/+/, ""));
    }

    function parseMoney(s) {
      if (s == null || s === "") return null;
      const t = String(s).trim().replace(/[−–—]/g, "-");
      const neg = /^\(.*\)$/.test(t) || t.startsWith("-");
      let digits = t.replace(/[^0-9.]/g, "");
      if ((digits.match(/\./g) || []).length > 1) return null;
      const n = Number(digits);
      if (Number.isNaN(n)) return null;
      return neg ? -n : n;
    }

    function looksLikeNumberToken(raw) {
      const s = String(raw || "").replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/^\$/, "");
      return /^-?\(?\d[\d,]*\)?(?:\.00)?$/.test(s);
    }

    function itemX(it) { return it.transform ? it.transform[4] : 0; }
    function itemY(it) { return it.transform ? it.transform[5] : 0; }

    function findValueRuns(items, target) {
      if (target == null || Number.isNaN(Number(target))) return [];
      const want = Math.round(Number(target));
      const hits = [];
      const rows = [];
      items.forEach(it => {
        const y = itemY(it);
        let row = rows.find(r => Math.abs(r.y - y) <= 4);
        if (!row) { row = { y, items: [] }; rows.push(row); }
        row.items.push(it);
      });
      rows.forEach(r => r.items.sort((a, b) => itemX(a) - itemX(b)));
      const parseCluster = (run) => {
        const raw = run.map(it => it.str).join("").replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/^\$/, "");
        if (!looksLikeNumberToken(raw)) return null;
        return parseMoney(raw);
      };
      rows.forEach(row => {
        const line = row.items;
        for (let i = 0; i < line.length; i++) {
          for (let j = i + 1; j <= line.length && j - i <= 16; j++) {
            const n = parseCluster(line.slice(i, j));
            if (n != null && Math.round(n) === want) hits.push(line.slice(i, j));
          }
        }
      });
      if (hits.length) return hits;
      let hay = "";
      const map = [];
      items.forEach((it, idx) => {
        const t = String(it.str).replace(/\s+/g, "").replace(/[−–—]/g, "-");
        for (let k = 0; k < t.length; k++) map.push(idx);
        hay += t;
      });
      const q = (want < 0 ? "-" : "") + String(Math.abs(want)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const raw = String(Math.round(target));
      [q, raw].forEach(needle => {
        let from = 0;
        while (from < hay.length) {
          const at = hay.indexOf(needle, from);
          if (at < 0) break;
          const before = at > 0 ? hay[at - 1] : "";
          const after = at + needle.length < hay.length ? hay[at + needle.length] : "";
          if (isNumChar(before) || isNumChar(after)) { from = at + 1; continue; }
          const a = map[at], b = map[Math.min(at + needle.length - 1, map.length - 1)];
          if (a != null && b != null) hits.push(items.slice(a, b + 1));
          from = at + needle.length;
        }
      });
      return hits;
    }

    function variants(q) {
      if (!q) return [];
      const s = String(q).trim();
      const n = parseMoney(s);
      const out = new Set([s]);
      if (n == null) return [...out];
      const abs = Math.round(Math.abs(n)).toLocaleString("en-US");
      const raw = String(Math.round(Math.abs(n)));
      if (n < 0) {
        out.add("-" + abs);
        out.add("-" + raw);
        out.add("(" + abs + ")");
        out.add("(" + raw + ")");
      } else {
        out.add(abs);
        out.add(raw);
      }
      return [...out].sort((a, b) => b.length - a.length);
    }

    function isNumChar(ch) {
      return ch >= "0" && ch <= "9";
    }

    function wholeNumberIndex(hay, q, from) {
      const at = hay.indexOf(q, from);
      if (at < 0) return -1;
      const before = at > 0 ? hay[at - 1] : "";
      const after = at + q.length < hay.length ? hay[at + q.length] : "";
      if (isNumChar(before) || isNumChar(after)) return -2;
      return at;
    }

    async function render() {
      if (!pdf) return;
      const t = ++token;
      try {
        const page = await pdf.getPage(pageNum);
        if (t !== token) return;
        const canvas = $("cv");
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const maxW = Math.max(640, $("body").clientWidth - 32);
        const base = page.getViewport({ scale: 1 });
        const cssScale = maxW / base.width;
        const vp = page.getViewport({ scale: cssScale * dpr });
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        canvas.style.width = Math.floor(vp.width / dpr) + "px";
        canvas.style.height = Math.floor(vp.height / dpr) + "px";
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        if (t !== token) return;
        $("pageLabel").textContent = `p. ${pageNum} of ${pdf.numPages}`;
        $("hl").textContent = highlightOn ? "Hide highlight" : "Show highlight";
        if (highlightOn && query) {
          const content = await page.getTextContent();
          const items = content.items.filter((it) => it.str && it.str.trim());
          let hay = "", map = [];
          items.forEach((it, i) => {
            const s = it.str.replace(/\s+/g, "");
            for (let k = 0; k < s.length; k++) map.push(i);
            hay += s.toLowerCase();
          });
          const want = parseMoney(query);
          const found = want != null ? findValueRuns(items, want) : [];
          const run = found[0] || null;
          if (run && run.length) {
            ctx.fillStyle = "rgba(165,129,75,.38)";
            ctx.strokeStyle = "rgba(165,129,75,.95)";
            ctx.lineWidth = 2;
            run.forEach((it) => {
              const m = transformItem(vp, it);
              const x = m[4], y = m[5], h = Math.hypot(m[2], m[3]);
              const w = (it.width || 0) * vp.scale;
              ctx.fillRect(x, y - h * 0.85, Math.max(w, 8), h * 1.15);
              ctx.strokeRect(x, y - h * 0.85, Math.max(w, 8), h * 1.15);
            });
            const firstY = transformItem(vp, run[0])[5] / dpr;
            $("body").scrollTop = Math.max(0, firstY - 120);
            setStatus("Highlight: " + query);
          } else {
            setStatus("Page loaded — figure not found on this page.");
          }
        } else {
          setStatus(highlightOn ? "Page loaded." : "Highlight off.");
        }
      } catch (e) {
        console.error(e);
        setStatus("Could not render this page.", true);
      }
    }

    async function main() {
      const loading = $("loading");
      const loadingPct = $("loadingPct");
      const loadingBar = $("loadingBar");
      try {
        if (!params.book && !params.pdf) {
          if (loading) loading.hidden = true;
          setStatus("No source selected. Close this tab and click Open page on the dashboard.", true);
          return;
        }
        const file = await resolvePdfUrl();
        if (!file) {
          if (loading) loading.hidden = true;
          setStatus("Could not find that budget book. Close this tab and click Open page again.", true);
          return;
        }
        $("raw").href = file;
        $("loadingText").textContent = params.book ? "Opening the " + params.book + " book…" : "Opening the source book…";
        pdfjsLib = await import(PDFJS + "/pdf.min.mjs");
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "/pdf.worker.min.mjs";
        const res = await fetch(file);
        if (!res.ok) throw new Error("PDF HTTP " + res.status);
        const total = Number(res.headers.get("content-length") || 0);
        const reader = res.body && res.body.getReader ? res.body.getReader() : null;
        let data;
        if (!reader) {
          data = await res.arrayBuffer();
        } else {
          const chunks = [];
          let loaded = 0;
          while (true) {
            const step = await reader.read();
            if (step.done) break;
            chunks.push(step.value);
            loaded += step.value.byteLength;
            if (total && loadingBar) {
              const p = Math.min(100, Math.round((loaded / total) * 100));
              loadingBar.style.animation = "none";
              loadingBar.style.width = p + "%";
              if (loadingPct) loadingPct.textContent = p + "% · loaded";
            }
          }
          const out = new Uint8Array(loaded);
          let offset = 0;
          chunks.forEach((c) => { out.set(c, offset); offset += c.byteLength; });
          data = out.buffer;
        }
        pdf = await pdfjsLib.getDocument({ data, verbosity: 0 }).promise;
        pageNum = Math.min(Math.max(1, startPage), pdf.numPages);
        await render();
        if (loading) loading.hidden = true;
      } catch (e) {
        console.error(e);
        if (loading) loading.hidden = true;
        setStatus("Could not load this PDF. Try Download PDF.", true);
      }
    }

    $("prev").onclick = () => { if (pageNum > 1) { pageNum--; render(); } };
    $("next").onclick = () => { if (pdf && pageNum < pdf.numPages) { pageNum++; render(); } };
    $("hl").onclick = () => { highlightOn = !highlightOn; render(); };
    window.addEventListener("resize", () => render());
    main();
  </script>
</body>
</html>
